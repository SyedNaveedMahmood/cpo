[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpo-hch"
version = "0.1.0"
description = "Criterion-Priority Obedience and Hidden Criterion Hierarchies in LLM Judges"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.33.0",
  "bitsandbytes>=0.43.3",
  "datasets>=2.20.0",
  "huggingface_hub>=0.24.0",
  "matplotlib>=3.8.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pyyaml>=6.0.1",
  "scipy>=1.11.0",
  "sentencepiece>=0.2.0",
  "tqdm>=4.66.0",
  "transformers>=4.44.0",
  "protobuf>=4.25.0"
]

[tool.setuptools.packages.find]
where = ["src"]
